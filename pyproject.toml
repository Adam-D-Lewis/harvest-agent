[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harvest-agent"
version = "0.1.0"
description = "PydanticAI agent that wraps the harvest CLI"
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai",
    "pydantic>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/harvest_agent"]
